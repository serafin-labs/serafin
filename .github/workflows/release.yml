name: Release

on:
    push:
        # v1 publishes the v1 prereleases (Changesets pre mode), under the dist-tag of the prerelease
        branches: [master, v1]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write # npm trusted publishing and provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            # Opens a "Version packages" pull request while changesets are pending,
            # and publishes the packages once it is merged. Every package runs its
            # checks before publishing, in `prepublishOnly`.
            - uses: changesets/action@v1
              with:
                  version: pnpm run version
                  publish: pnpm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Only to publish a package for the first time, as trusted publishing can only be set up
                  # for a package that exists. Remove the secret once every package has a trusted publisher.
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
